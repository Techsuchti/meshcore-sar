name: meshcore_sar_app
description: "MeshCore SAR (Search & Rescue) app with BLE mesh networking and offline maps"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for the application.
version: 2026.0613.2+57

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Internationalization
  intl: any
  cupertino_icons: ^1.0.8

  # MeshCore BLE protocol client
  meshcore_client:
    git:
      url: https://github.com/dz0ny/meshcore_client.git
      ref: 0bb339f684f709cf5b9d40c07827cc62beb18a4d

  # Codec2 ultra-low-bitrate speech codec (FFI plugin)
  codec2_flutter:
    git:
      url: https://github.com/dz0ny/codec2_flutter.git
      ref: 03998a2
  ffi: ^2.1.0

  # Voice recording (raw PCM stream at 8000 Hz)
  record: ^6.0.0

  # Voice playback (plays WAV from file)
  audioplayers: ^6.0.0

  # BLE connectivity
  flutter_blue_plus: ^2.0.0

  # State management
  provider: ^6.1.0

  # Map display
  flutter_map:
    git:
      url: https://github.com/fleaflet/flutter_map.git
      ref: master
  latlong2: ^0.9.0
  fl_chart: ^1.2.0
  http: ^1.2.0

  # Coordinate system projections for WMS (EPSG:3794)
  proj4dart: ^3.0.0

  # Permissions
  permission_handler: ^12.0.1

  # Location services
  geolocator: ^14.0.2
  flutter_compass: ^0.8.0

  # File handling
  share_plus: ^12.0.0
  path_provider: ^2.1.5
  file_picker: ^10.3.3

  # Image messaging (pick + AVIF encode/decode for mesh transmission)
  image_picker: ^1.1.2
  # 3.1.0 of flutter_avif pulls flutter_avif_android 3.1.0,
  # which has a duplicate Java/Kotlin plugin class with newer AGP.
  # 3.0.0 provides the same AVIF functionality without that packaging bug.
  flutter_avif: 3.0.0

  # Persistent storage
  shared_preferences: ^2.3.3
  sqflite: ^2.4.2

  # Package info
  package_info_plus: ^9.0.0
  wakelock_plus: ^1.4.0

  # Background services
  flutter_background_service: ^5.0.13

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Vibration
  vibration: ^3.1.4

  # URL launching
  url_launcher: ^6.3.0

  # Cryptographic functions (for channel secret hashing)
  crypto: ^3.0.3

  # XML parsing for GPX import/export
  xml: ^6.5.0

  # Network Service Discovery (Bonjour/mDNS)
  nsd: ^4.0.3
  usb_serial: ^0.5.2
  web: ^1.1.1
  flutter_libserialport: ^0.6.0
  webserial: ^1.2.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  fake_async: ^1.3.3
  sqflite_common_ffi: ^2.3.6

dependency_overrides:
  # Keep local package overrides in pubspec_overrides.yaml so CI uses the
  # declared dependency source from this file.
  # path_provider_foundation 2.6.0 pulls in package:objective_c as a native
  # asset. That framework has been ending up archived with a macOS platform
  # slice and fails App Store validation for iOS uploads.
  path_provider_foundation: 2.5.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#ddd"
    theme_color: "#fff"
  windows:
    generate: true
    image_path: "icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - screenshots/ios/
