name: Apply SAR Channel Routing Fix v4

on:
  push:
    paths:
      - '.github/workflows/apply-sar-channel-routing-fix-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.4"

jobs:
  patch-build-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch SAR routing
        shell: python
        run: |
          from pathlib import Path
          import re

          def insert_after_first(path, anchor, insertion):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if insertion.strip() in text:
                  print(f'{path}: already patched')
                  return
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit(f'{path}: anchor not found: {anchor!r}')
              pos += len(anchor)
              p.write_text(text[:pos] + insertion + text[pos:], encoding='utf-8')
              print(f'{path}: inserted')

          def replace_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text2, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {count}: {pattern!r}')
              p.write_text(text2, encoding='utf-8')
              print(f'{path}: replaced')

          # Add an optional positional channelIndex to each sheet callback.
          # This is deliberately anchored to the callback declaration so other
          # occurrences of colorIndex are not touched.
          for path in [
              'lib/widgets/messages/sar_update_sheet.dart',
              'lib/widgets/messages/custom_map_sar_update_sheet.dart',
          ]:
              text = Path(path).read_text(encoding='utf-8')
              start = text.find('final Future<void> Function(')
              if start < 0:
                  raise SystemExit(f'{path}: callback declaration not found')
              end = text.find('  onSend;', start)
              if end < 0:
                  raise SystemExit(f'{path}: onSend declaration not found')
              block = text[start:end]
              if 'int? channelIndex' not in block:
                  marker = '    int colorIndex,\n'
                  if marker not in block:
                      raise SystemExit(f'{path}: colorIndex marker not found in callback')
                  block = block.replace(marker, marker + '    int? channelIndex,\n', 1)
                  text = text[:start] + block + text[end:]
                  Path(path).write_text(text, encoding='utf-8')
                  print(f'{path}: callback channelIndex added')

              # Add the selected channel index to the callback invocation.
              text = Path(path).read_text(encoding='utf-8')
              start = text.find('await widget.onSend(')
              if start < 0:
                  raise SystemExit(f'{path}: widget.onSend call not found')
              end = text.find('                            );', start)
              if end < 0:
                  raise SystemExit(f'{path}: widget.onSend closing not found')
              block = text[start:end]
              if ' _selectedContact!.publicKey[1]' not in block:
                  marker = '                              _selectedTemplate!\n                                  .getColorIndex(), // Include color index\n'
                  if marker not in block:
                      marker = '                              _selectedTemplate!\n                                  .getColorIndex(),\n'
                  if marker not in block:
                      raise SystemExit(f'{path}: onSend colorIndex marker not found')
                  replacement = marker + '                              !_sendToAllContacts &&\n                                      _selectedContact?.isChannel == true &&\n                                      _selectedContact!.publicKey.length > 1\n                                  ? _selectedContact!.publicKey[1]\n                                  : null,\n'
                  block = block.replace(marker, replacement, 1)
                  text = text[:start] + block + text[end:]
                  Path(path).write_text(text, encoding='utf-8')
                  print(f'{path}: selected channelIndex forwarded')

          # In MapTab, add the optional parameter to the two SAR callback closures.
          replace_once(
              'lib/screens/map_tab.dart',
              r'(Future<void> _sendSarMessage\([^)]*?int colorIndex,\n)(\s*\) async)',
              r'\1    int? channelIndex,\n\2',
          )
          replace_once(
              'lib/screens/map_tab.dart',
              r'(Future<void> _sendCustomMapSarMessage\([^)]*?int colorIndex,\n)(\s*\) async)',
              r'\1    int? channelIndex,\n\2',
          )

          # Forward the explicit index into the payload sender.
          replace_once(
              'lib/screens/map_tab.dart',
              r'(_sendSarPayload\([\s\S]*?sendToAllContacts: sendToAllContacts,\n)(\s*\);)',
              r'\1      channelIndex: channelIndex,\n\2',
          )
          replace_once(
              'lib/screens/map_tab.dart',
              r'(_sendSarPayload\([\s\S]*?sendToAllContacts: sendToAllContacts,\n)(\s*\);)',
              r'\1      channelIndex: channelIndex,\n\2',
          )

          # Add the optional parameter to _sendSarPayload.
          replace_once(
              'lib/screens/map_tab.dart',
              r'(Future<void> _sendSarPayload\([\s\S]*?bool sendToAllContacts,\n)(\s*\} async)',
              r'\1    int? channelIndex,\n\2',
          )

          # Use the explicit index for the actual MeshCore channel command.
          replace_once(
              'lib/screens/map_tab.dart',
              r'(if \(sendToChannel\) \{\n)(\s*final messageId =)',
              r'\1        final selectedChannelIdx = channelIndex ?? _sarChannelIndex(roomPublicKey);\n        debugPrint(\'📍 [SAR] selected channelIndex=\$selectedChannelIdx explicit=\$channelIndex keyPrefix=\${roomPublicKey != null && roomPublicKey.length >= 2 ? roomPublicKey.sublist(0, 2) : null}\');\n\2',
          )
          replace_once(
              'lib/screens/map_tab.dart',
              r'(channelIdx: )_sarChannelIndex\(roomPublicKey\)(,\n\s*text: sarMessage,)',
              r'\1selectedChannelIdx\2',
          )
          replace_once(
              'lib/screens/map_tab.dart',
              r'(channelIdx: )0(,\n\s*\);\n\n\s*messagesProvider\.addSentMessage\(sentMessage\);)',
              r'\1selectedChannelIdx\2',
          )

          Path('SAR_ROUTING_V4_APPLIED.md').write_text('Explicit SAR channel index propagation applied.\n', encoding='utf-8')
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: sar-channel-routing-v4-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/messages/sar_update_sheet.dart lib/widgets/messages/custom_map_sar_update_sheet.dart lib/screens/map_tab.dart SAR_ROUTING_V4_APPLIED.md
          git commit -m "fix: propagate explicit SAR channel index" || true
          git push || true

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-sar-channel-routing-fix-v3.yml 2>/dev/null || true
          git commit -m "chore: remove temporary SAR routing workflow" || true
          git push || true
