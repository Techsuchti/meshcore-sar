name: Apply SAR Channel Routing Fix v2

on:
  push:
    paths:
      - '.github/workflows/apply-sar-channel-routing-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.4"

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch SAR channel routing
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'patched {path}')

          replace(
              'lib/widgets/messages/sar_update_sheet.dart',
              '''    bool sendToAllContacts,\n    int colorIndex,\n  )\n  onSend;''',
              '''    bool sendToAllContacts,\n    int colorIndex,\n    int? channelIndex,\n  )\n  onSend;''',
          )

          replace(
              'lib/widgets/messages/sar_update_sheet.dart',
              '''                              _selectedTemplate!.emoji,\n                              displayText,\n                              position,\n                              _sendToAllContacts\n                                  ? null\n                                  : _selectedContact!.publicKey,\n                              _sendToAllContacts\n                                  ? false\n                                  : _selectedContact!.isChannel,\n                              _sendToAllContacts,\n                              _selectedTemplate!.colorIndex,\n                            );''',
              '''                              _selectedTemplate!.emoji,\n                              displayText,\n                              position,\n                              _sendToAllContacts\n                                  ? null\n                                  : _selectedContact!.publicKey,\n                              _sendToAllContacts\n                                  ? false\n                                  : _selectedContact!.isChannel,\n                              _sendToAllContacts,\n                              _selectedTemplate!.colorIndex,\n                              !_sendToAllContacts &&\n                                      _selectedContact?.isChannel == true &&\n                                      _selectedContact!.publicKey.length > 1\n                                  ? _selectedContact!.publicKey[1]\n                                  : null,\n                            );''',
          )

          replace(
              'lib/widgets/messages/custom_map_sar_update_sheet.dart',
              '''    bool sendToAllContacts,\n    int colorIndex,\n  )\n  onSend;''',
              '''    bool sendToAllContacts,\n    int colorIndex,\n    int? channelIndex,\n  )\n  onSend;''',
          )

          replace(
              'lib/widgets/messages/custom_map_sar_update_sheet.dart',
              '''                              _selectedTemplate!.emoji,\n                              displayText,\n                              _selectedPoint!,\n                              _sendToAllContacts\n                                  ? null\n                                  : _selectedContact!.publicKey,\n                              _sendToAllContacts\n                                  ? false\n                                  : _selectedContact!.isChannel,\n                              _sendToAllContacts,\n                              _selectedTemplate!.colorIndex,\n                            );''',
              '''                              _selectedTemplate!.emoji,\n                              displayText,\n                              _selectedPoint!,\n                              _sendToAllContacts\n                                  ? null\n                                  : _selectedContact!.publicKey,\n                              _sendToAllContacts\n                                  ? false\n                                  : _selectedContact!.isChannel,\n                              _sendToAllContacts,\n                              _selectedTemplate!.colorIndex,\n                              !_sendToAllContacts &&\n                                      _selectedContact?.isChannel == true &&\n                                      _selectedContact!.publicKey.length > 1\n                                  ? _selectedContact!.publicKey[1]\n                                  : null,\n                            );''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''              sendToAllContacts,\n              colorIndex,\n            ) async {\n              await _sendSarMessage(\n                emoji,\n                name,\n                position,\n                roomPublicKey,\n                sendToChannel,\n                sendToAllContacts,\n                colorIndex,\n              );''',
              '''              sendToAllContacts,\n              colorIndex,\n              channelIndex,\n            ) async {\n              await _sendSarMessage(\n                emoji,\n                name,\n                position,\n                roomPublicKey,\n                sendToChannel,\n                sendToAllContacts,\n                colorIndex,\n                channelIndex,\n              );''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''              sendToAllContacts,\n              colorIndex,\n            ) async {\n              await _sendCustomMapSarMessage(\n                emoji,\n                name,\n                storedPoint,\n                customMapConfig.mapId,\n                roomPublicKey,\n                sendToChannel,\n                sendToAllContacts,\n                colorIndex,\n              );''',
              '''              sendToAllContacts,\n              colorIndex,\n              channelIndex,\n            ) async {\n              await _sendCustomMapSarMessage(\n                emoji,\n                name,\n                storedPoint,\n                customMapConfig.mapId,\n                roomPublicKey,\n                sendToChannel,\n                sendToAllContacts,\n                colorIndex,\n                channelIndex,\n              );''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''    bool sendToAllContacts,\n    int colorIndex,\n  ) async {\n    final sarMessage = SarMessageParser.createSarMessage(''',
              '''    bool sendToAllContacts,\n    int colorIndex,\n    int? channelIndex,\n  ) async {\n    final sarMessage = SarMessageParser.createSarMessage(''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''      roomPublicKey: roomPublicKey,\n      sendToChannel: sendToChannel,\n      sendToAllContacts: sendToAllContacts,\n    );\n  }\n\n  Future<void> _sendCustomMapSarMessage(''',
              '''      roomPublicKey: roomPublicKey,\n      sendToChannel: sendToChannel,\n      sendToAllContacts: sendToAllContacts,\n      channelIndex: channelIndex,\n    );\n  }\n\n  Future<void> _sendCustomMapSarMessage(''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''    bool sendToAllContacts,\n    int colorIndex,\n  ) async {\n    final sarMessage = SarMessageParser.createCustomMapSarMessage(''',
              '''    bool sendToAllContacts,\n    int colorIndex,\n    int? channelIndex,\n  ) async {\n    final sarMessage = SarMessageParser.createCustomMapSarMessage(''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''      roomPublicKey: roomPublicKey,\n      sendToChannel: sendToChannel,\n      sendToAllContacts: sendToAllContacts,\n    );\n  }\n\n  int _sarChannelIndex''',
              '''      roomPublicKey: roomPublicKey,\n      sendToChannel: sendToChannel,\n      sendToAllContacts: sendToAllContacts,\n      channelIndex: channelIndex,\n    );\n  }\n\n  int _sarChannelIndex''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''    bool sendToAllContacts,\n  }) async {\n    final connectionProvider''',
              '''    bool sendToAllContacts,\n    int? channelIndex,\n  }) async {\n    final connectionProvider''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''      if (sendToChannel) {\n        final messageId =''',
              '''      if (sendToChannel) {\n        final selectedChannelIdx = channelIndex ?? _sarChannelIndex(roomPublicKey);\n        debugPrint(\n          '📍 [SAR] Sending marker to channel index=$selectedChannelIdx '\n          'explicitChannelIndex=$channelIndex roomKey=${roomPublicKey != null ? roomPublicKey.take(2).toList() : null}',\n        );\n        final messageId =''',
          )

          replace(
              'lib/screens/map_tab.dart',
              '''          channelIdx: 0,\n        );\n\n        messagesProvider.addSentMessage(sentMessage);\n\n        await connectionProvider.sendChannelMessage(\n          channelIdx: _sarChannelIndex(roomPublicKey),''',
              '''          channelIdx: selectedChannelIdx,\n        );\n\n        messagesProvider.addSentMessage(sentMessage);\n\n        await connectionProvider.sendChannelMessage(\n          channelIdx: selectedChannelIdx,''',
          )

          Path('SAR_ROUTING_V2_APPLIED.md').write_text(
              'SAR channel routing v2 applied with explicit channel index propagation and debug logging.\n',
              encoding='utf-8',
          )
      - name: Verify Dart source
        run: |
          grep -n "int? channelIndex" lib/widgets/messages/sar_update_sheet.dart lib/widgets/messages/custom_map_sar_update_sheet.dart lib/screens/map_tab.dart
          grep -n "selectedChannelIdx" lib/screens/map_tab.dart

      - name: Commit source patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/messages/sar_update_sheet.dart lib/widgets/messages/custom_map_sar_update_sheet.dart lib/screens/map_tab.dart SAR_ROUTING_V2_APPLIED.md
          git commit -m "fix: propagate explicit SAR channel index" || exit 0
          git push

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: sar-channel-routing-v2-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Remove temporary workflow
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git rm -f .github/workflows/apply-sar-channel-routing-fix-v2.yml || true
          git commit -m "chore: remove temporary SAR routing workflow" || true
          git push || true
