name: Fix SAR channel routing

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip sar routing fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SAR channel routing
        shell: python
        run: |
          from pathlib import Path

          def ensure_replacement(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print(f'{path}: already patched')
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected old pattern exactly once, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: patched')

          ensure_replacement(
              'lib/widgets/messages/sar_update_sheet.dart',
              '''                              _sendToAllContacts\n                                  ? null\n                                  : (_selectedContact!.isChannel\n                                        ? null\n                                        : _selectedContact!.publicKey),\n''',
              '''                              _sendToAllContacts\n                                  ? null\n                                  : _selectedContact!.publicKey,\n''',
          )

          ensure_replacement(
              'lib/widgets/messages/custom_map_sar_update_sheet.dart',
              '''                      _selectedContact?.isChannel == true\n                          ? null\n                          : _selectedContact?.publicKey,\n''',
              '''                      _selectedContact?.publicKey,\n''',
          )

          map_path = Path('lib/screens/map_tab.dart')
          map_text = map_path.read_text(encoding='utf-8')

          helper = '''  int _sarChannelIndex(Uint8List? channelPublicKey) {\n    if (channelPublicKey == null || channelPublicKey.length < 2) {\n      return 0;\n    }\n    return channelPublicKey[1];\n  }\n\n'''

          if '_sarChannelIndex(Uint8List? channelPublicKey)' not in map_text:
              marker = '  Future<void> _sendSarPayload({\n'
              if marker not in map_text:
                  raise SystemExit('lib/screens/map_tab.dart: _sendSarPayload marker not found')
              map_text = map_text.replace(marker, helper + marker, 1)
              print('lib/screens/map_tab.dart: inserted channel-index helper')
          else:
              print('lib/screens/map_tab.dart: channel-index helper already present')

          method_start = map_text.find('  Future<void> _sendSarPayload({\n')
          if method_start < 0:
              raise SystemExit('lib/screens/map_tab.dart: _sendSarPayload method not found')

          prefix = map_text[:method_start]
          method = map_text[method_start:]
          old_channel = '''        await connectionProvider.sendChannelMessage(\n          channelIdx: 0,\n          text: sarMessage,\n          messageId: messageId,\n        );\n'''
          new_channel = '''        await connectionProvider.sendChannelMessage(\n          channelIdx: _sarChannelIndex(roomPublicKey),\n          text: sarMessage,\n          messageId: messageId,\n        );\n'''

          if new_channel in method:
              print('lib/screens/map_tab.dart: SAR channel routing already patched')
          else:
              count = method.count(old_channel)
              if count != 1:
                  raise SystemExit(f'lib/screens/map_tab.dart: expected exactly 1 SAR channel send block inside _sendSarPayload, found {count}')
              method = method.replace(old_channel, new_channel, 1)
              map_text = prefix + method
              print('lib/screens/map_tab.dart: patched SAR channel index')

          map_path.write_text(map_text, encoding='utf-8')

          # Final verification before committing.
          checks = {
              'lib/widgets/messages/sar_update_sheet.dart': '_sendToAllContacts\\n                                  ? null\\n                                  : _selectedContact!.publicKey,',
              'lib/widgets/messages/custom_map_sar_update_sheet.dart': '_selectedContact?.publicKey,',
              'lib/screens/map_tab.dart': 'channelIdx: _sarChannelIndex(roomPublicKey),',
          }
          for path, needle in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'{path}: final verification failed')

      - name: Commit fix and remove migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-sar-channel-routing.yml SAR_ROUTING_MIGRATION_TRIGGER.md
          git add lib/screens/map_tab.dart lib/widgets/messages/sar_update_sheet.dart lib/widgets/messages/custom_map_sar_update_sheet.dart .github/workflows/fix-sar-channel-routing.yml SAR_ROUTING_MIGRATION_TRIGGER.md
          git diff --cached --quiet && exit 0
          git commit -m "fix: route SAR markers to selected channel [skip sar routing fix]"
          git push
