# This file configures the analyzer, which statically analyzes Dart code for
# errors, warnings, and lints.
#
# See https://dart.dev/tools/analysis for more information.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # The existing fast-GPS logic intentionally keeps these assertions
    # alongside nullable state checks.
    unnecessary_non_null_assertion: ignore

linter:
  rules:
    # This code intentionally performs work across async gaps and checks
    # `mounted` before using the BuildContext afterward.
    use_build_context_synchronously: false
